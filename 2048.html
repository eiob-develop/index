<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎯 2048</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #ecf0f1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    user-select: none;
  }
  .top-bar {
    width: 100%;
    max-width: 500px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .home-btn {
    color: #94a3b8;
    text-decoration: none;
    font-size: 14px;
    padding: 8px 14px;
    border-radius: 6px;
    background: rgba(255,255,255,.05);
    transition: background .2s, color .2s;
  }
  .home-btn:hover { background: rgba(255,255,255,.1); color: #f1c40f; }

  h1 { font-size: 28px; color: #f1c40f; }

  .panel {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }
  .score-box {
    background: #1e293b;
    padding: 8px 16px;
    border-radius: 8px;
    text-align: center;
    min-width: 90px;
  }
  .score-label {
    font-size: 11px;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .score-value {
    font-size: 22px;
    font-weight: bold;
    color: #f1c40f;
  }
  .new-game {
    background: #f1c40f;
    color: #1e293b;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
  }
  .new-game:hover { background: #d4ac0d; }

  #board {
    background: #283447;
    padding: 10px;
    border-radius: 12px;
    display: grid;
    grid-template-columns: repeat(4, 80px);
    grid-template-rows: repeat(4, 80px);
    gap: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  .tile {
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: bold;
    transition: all .15s;
  }
  .tile.v0 { background: rgba(255,255,255,.05); }
  .tile.v2 { background: #ecf0f1; color: #2c3e50; }
  .tile.v4 { background: #ddc8b1; color: #2c3e50; }
  .tile.v8 { background: #f39c12; color: white; }
  .tile.v16 { background: #e67e22; color: white; }
  .tile.v32 { background: #e74c3c; color: white; }
  .tile.v64 { background: #c0392b; color: white; }
  .tile.v128 { background: #f1c40f; color: white; font-size: 24px; }
  .tile.v256 { background: #f39c12; color: white; font-size: 24px; }
  .tile.v512 { background: #e67e22; color: white; font-size: 24px; }
  .tile.v1024 { background: #16a085; color: white; font-size: 22px; }
  .tile.v2048 { background: #1abc9c; color: white; font-size: 22px; }
  .tile.v4096 { background: #2c3e50; color: white; font-size: 22px; }

  #message {
    margin-top: 18px;
    font-size: 20px;
    font-weight: bold;
    min-height: 28px;
  }
  .win { color: #1abc9c; }
  .lose { color: #e74c3c; }

  .hint {
    margin-top: 14px;
    color: #64748b;
    font-size: 13px;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="top-bar">
    <a href="index.html" class="home-btn">← 홈</a>
    <h1>🎯 2048</h1>
    <div style="width: 50px;"></div>
  </div>

  <div class="panel">
    <div class="score-box">
      <div class="score-label">점수</div>
      <div class="score-value" id="score">0</div>
    </div>
    <div class="score-box">
      <div class="score-label">최고</div>
      <div class="score-value" id="best">0</div>
    </div>
    <button class="new-game" id="newGame">새 게임</button>
  </div>

  <div id="board"></div>
  <div id="message"></div>
  <div class="hint">방향키 ↑ ↓ ← → 또는 WASD 로 조작 · 모바일은 스와이프</div>

<script>
const SIZE = 4;
let grid = [];
let score = 0;
let best = +localStorage.getItem('2048-best') || 0;
let won = false;
let over = false;

const $board = document.getElementById('board');
const $score = document.getElementById('score');
const $best = document.getElementById('best');
const $message = document.getElementById('message');
$best.textContent = best;

function init() {
  grid = Array.from({length: SIZE}, () => Array(SIZE).fill(0));
  score = 0;
  won = false;
  over = false;
  $message.textContent = '';
  $message.className = '';
  addRandom();
  addRandom();
  render();
}

function addRandom() {
  const empties = [];
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (grid[r][c] === 0) empties.push([r, c]);
  if (!empties.length) return;
  const [r, c] = empties[Math.floor(Math.random() * empties.length)];
  grid[r][c] = Math.random() < 0.9 ? 2 : 4;
}

function render() {
  $board.innerHTML = '';
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++) {
      const tile = document.createElement('div');
      const v = grid[r][c];
      tile.className = 'tile v' + v;
      tile.textContent = v || '';
      $board.appendChild(tile);
    }
  $score.textContent = score;
  if (score > best) {
    best = score;
    localStorage.setItem('2048-best', best);
    $best.textContent = best;
  }
}

function slide(row) {
  const filtered = row.filter(x => x !== 0);
  for (let i = 0; i < filtered.length - 1; i++) {
    if (filtered[i] === filtered[i+1]) {
      filtered[i] *= 2;
      score += filtered[i];
      if (filtered[i] === 2048 && !won) {
        won = true;
        $message.textContent = '🎉 2048 달성! 계속 플레이 가능';
        $message.className = 'win';
      }
      filtered[i+1] = 0;
    }
  }
  const result = filtered.filter(x => x !== 0);
  while (result.length < SIZE) result.push(0);
  return result;
}

function move(direction) {
  if (over) return;
  const before = JSON.stringify(grid);
  if (direction === 'left') {
    for (let r = 0; r < SIZE; r++) grid[r] = slide(grid[r]);
  } else if (direction === 'right') {
    for (let r = 0; r < SIZE; r++) grid[r] = slide(grid[r].reverse()).reverse();
  } else if (direction === 'up') {
    for (let c = 0; c < SIZE; c++) {
      const col = grid.map(row => row[c]);
      const newCol = slide(col);
      for (let r = 0; r < SIZE; r++) grid[r][c] = newCol[r];
    }
  } else if (direction === 'down') {
    for (let c = 0; c < SIZE; c++) {
      const col = grid.map(row => row[c]).reverse();
      const newCol = slide(col).reverse();
      for (let r = 0; r < SIZE; r++) grid[r][c] = newCol[SIZE - 1 - r];
    }
  }
  if (JSON.stringify(grid) !== before) {
    addRandom();
    render();
    if (isGameOver()) {
      over = true;
      $message.textContent = '💥 게임 오버!';
      $message.className = 'lose';
    }
  }
}

function isGameOver() {
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++) {
      if (grid[r][c] === 0) return false;
      if (c < SIZE-1 && grid[r][c] === grid[r][c+1]) return false;
      if (r < SIZE-1 && grid[r][c] === grid[r+1][c]) return false;
    }
  return true;
}

document.addEventListener('keydown', (e) => {
  const map = {
    'ArrowLeft': 'left', 'a': 'left', 'A': 'left',
    'ArrowRight': 'right', 'd': 'right', 'D': 'right',
    'ArrowUp': 'up', 'w': 'up', 'W': 'up',
    'ArrowDown': 'down', 's': 'down', 'S': 'down',
  };
  if (map[e.key]) {
    e.preventDefault();
    move(map[e.key]);
  }
});

let touchStart = null;
document.addEventListener('touchstart', e => {
  touchStart = [e.touches[0].clientX, e.touches[0].clientY];
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!touchStart) return;
  const dx = e.changedTouches[0].clientX - touchStart[0];
  const dy = e.changedTouches[0].clientY - touchStart[1];
  if (Math.abs(dx) < 30 && Math.abs(dy) < 30) return;
  if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
  else move(dy > 0 ? 'down' : 'up');
  touchStart = null;
});

document.getElementById('newGame').addEventListener('click', init);
init();
</script>
</body>
</html>
