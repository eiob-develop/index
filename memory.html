<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 메모리 매칭</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #ecf0f1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    user-select: none;
  }
  .top-bar {
    width: 100%;
    max-width: 700px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .home-btn {
    color: #94a3b8;
    text-decoration: none;
    font-size: 14px;
    padding: 8px 14px;
    border-radius: 6px;
    background: rgba(255,255,255,.05);
    transition: background .2s, color .2s;
  }
  .home-btn:hover { background: rgba(255,255,255,.1); color: #9b59b6; }

  h1 { font-size: 28px; color: #9b59b6; }

  .panel {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
  }
  .stat-box {
    background: #1e293b;
    padding: 8px 16px;
    border-radius: 8px;
    text-align: center;
    min-width: 80px;
  }
  .stat-label {
    font-size: 11px;
    color: #94a3b8;
    text-transform: uppercase;
  }
  .stat-value {
    font-size: 18px;
    font-weight: bold;
    color: #9b59b6;
  }

  .panel select, .panel button {
    border: none;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .panel select { background: #1e293b; color: white; border: 1px solid #9b59b6; }
  .panel button { background: #9b59b6; color: white; }
  .panel button:hover { background: #8e44ad; }

  #board {
    display: grid;
    gap: 10px;
    perspective: 1000px;
  }
  .card {
    aspect-ratio: 1;
    width: 80px;
    cursor: pointer;
    position: relative;
    transform-style: preserve-3d;
    transition: transform .4s;
  }
  .card.flipped, .card.matched {
    transform: rotateY(180deg);
  }
  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .card-front {
    background: linear-gradient(135deg, #9b59b6, #6a1b9a);
    color: white;
    font-size: 32px;
    font-weight: bold;
  }
  .card-back {
    background: #ecf0f1;
    transform: rotateY(180deg);
    font-size: 40px;
  }
  .card.matched .card-back {
    background: #d1f2eb;
    box-shadow: inset 0 0 0 3px #1abc9c;
  }

  #message {
    margin-top: 18px;
    font-size: 20px;
    font-weight: bold;
    min-height: 28px;
  }
  .win { color: #1abc9c; }
</style>
</head>
<body>
  <div class="top-bar">
    <a href="index.html" class="home-btn">← 홈</a>
    <h1>🧠 메모리 매칭</h1>
    <div style="width: 40px;"></div>
  </div>

  <div class="panel">
    <select id="difficulty">
      <option value="easy">쉬움 (4×3)</option>
      <option value="medium" selected>보통 (4×4)</option>
      <option value="hard">어려움 (6×4)</option>
    </select>
    <button id="newGame">새 게임</button>
    <div class="stat-box">
      <div class="stat-label">턴</div>
      <div class="stat-value" id="moves">0</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">시간</div>
      <div class="stat-value"><span id="timer">0</span>s</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">매치</div>
      <div class="stat-value"><span id="matches">0</span>/<span id="totalPairs">8</span></div>
    </div>
  </div>

  <div id="board"></div>
  <div id="message"></div>

<script>
const EMOJIS = ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🐦','🦆','🦅'];
const DIFFS = {
  easy:   { cols: 4, rows: 3 },
  medium: { cols: 4, rows: 4 },
  hard:   { cols: 6, rows: 4 },
};

let cards = [];
let flipped = [];
let matched = 0;
let moves = 0;
let seconds = 0;
let timerInterval = null;
let started = false;
let lock = false;

const $board = document.getElementById('board');
const $diff = document.getElementById('difficulty');
const $moves = document.getElementById('moves');
const $timer = document.getElementById('timer');
const $matches = document.getElementById('matches');
const $totalPairs = document.getElementById('totalPairs');
const $message = document.getElementById('message');

document.getElementById('newGame').addEventListener('click', newGame);
$diff.addEventListener('change', newGame);

function newGame() {
  const { cols, rows } = DIFFS[$diff.value];
  const total = cols * rows;
  const pairs = total / 2;
  const selected = EMOJIS.slice(0, pairs);
  cards = [...selected, ...selected].sort(() => Math.random() - 0.5);
  flipped = [];
  matched = 0;
  moves = 0;
  seconds = 0;
  started = false;
  lock = false;
  $moves.textContent = 0;
  $timer.textContent = 0;
  $matches.textContent = 0;
  $totalPairs.textContent = pairs;
  $message.textContent = '';
  $message.className = '';
  clearInterval(timerInterval);

  $board.style.gridTemplateColumns = `repeat(${cols}, 80px)`;
  $board.innerHTML = '';
  cards.forEach((emoji, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.index = i;
    card.innerHTML = `
      <div class="card-face card-front">?</div>
      <div class="card-face card-back">${emoji}</div>
    `;
    card.addEventListener('click', () => flipCard(i, card));
    $board.appendChild(card);
  });
}

function flipCard(i, card) {
  if (lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;
  if (!started) {
    started = true;
    timerInterval = setInterval(() => {
      seconds++;
      $timer.textContent = seconds;
    }, 1000);
  }
  card.classList.add('flipped');
  flipped.push({ i, card, emoji: cards[i] });

  if (flipped.length === 2) {
    moves++;
    $moves.textContent = moves;
    if (flipped[0].emoji === flipped[1].emoji) {
      flipped.forEach(f => {
        f.card.classList.remove('flipped');
        f.card.classList.add('matched');
      });
      matched++;
      $matches.textContent = matched;
      flipped = [];
      if (matched === cards.length / 2) {
        clearInterval(timerInterval);
        $message.textContent = `🎉 클리어! ${moves}턴, ${seconds}초`;
        $message.className = 'win';
      }
    } else {
      lock = true;
      setTimeout(() => {
        flipped.forEach(f => f.card.classList.remove('flipped'));
        flipped = [];
        lock = false;
      }, 800);
    }
  }
}

newGame();
</script>
</body>
</html>
