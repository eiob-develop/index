<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐍 스네이크</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #ecf0f1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    user-select: none;
  }
  .top-bar {
    width: 100%;
    max-width: 500px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .home-btn {
    color: #94a3b8;
    text-decoration: none;
    font-size: 14px;
    padding: 8px 14px;
    border-radius: 6px;
    background: rgba(255,255,255,.05);
    transition: background .2s, color .2s;
  }
  .home-btn:hover { background: rgba(255,255,255,.1); color: #2ecc71; }

  h1 { font-size: 28px; color: #2ecc71; }

  .panel {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }
  .stat-box {
    background: #1e293b;
    padding: 8px 16px;
    border-radius: 8px;
    text-align: center;
    min-width: 80px;
  }
  .stat-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; }
  .stat-value { font-size: 22px; font-weight: bold; color: #2ecc71; }

  .panel select, .panel button {
    border: none;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .panel select { background: #1e293b; color: white; border: 1px solid #2ecc71; }
  .panel button { background: #2ecc71; color: white; }
  .panel button:hover { background: #27ae60; }

  canvas {
    background: #283447;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
    max-width: 100%;
    height: auto;
  }

  #message {
    margin-top: 18px;
    font-size: 20px;
    font-weight: bold;
    min-height: 28px;
  }
  .lose { color: #e74c3c; }
  .pause { color: #f1c40f; }

  .hint {
    margin-top: 14px;
    color: #64748b;
    font-size: 13px;
    text-align: center;
  }

  .controls {
    margin-top: 18px;
    display: none;
    grid-template-columns: repeat(3, 60px);
    gap: 6px;
  }
  .controls button {
    aspect-ratio: 1;
    background: #2ecc71;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 22px;
    cursor: pointer;
  }
  .controls .empty { visibility: hidden; }
  @media (max-width: 600px) {
    .controls { display: grid; }
  }
</style>
</head>
<body>
  <div class="top-bar">
    <a href="index.html" class="home-btn">← 홈</a>
    <h1>🐍 스네이크</h1>
    <div style="width: 40px;"></div>
  </div>

  <div class="panel">
    <div class="stat-box">
      <div class="stat-label">점수</div>
      <div class="stat-value" id="score">0</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">최고</div>
      <div class="stat-value" id="best">0</div>
    </div>
    <select id="speed">
      <option value="150">느림</option>
      <option value="100" selected>보통</option>
      <option value="60">빠름</option>
    </select>
    <button id="newGame">새 게임</button>
  </div>

  <canvas id="canvas" width="400" height="400"></canvas>
  <div id="message"></div>
  <div class="hint">방향키 ↑ ↓ ← → 또는 WASD · 스페이스바 일시정지</div>

  <div class="controls">
    <button class="empty"></button>
    <button data-dir="up">↑</button>
    <button class="empty"></button>
    <button data-dir="left">←</button>
    <button class="empty"></button>
    <button data-dir="right">→</button>
    <button class="empty"></button>
    <button data-dir="down">↓</button>
    <button class="empty"></button>
  </div>

<script>
const SIZE = 20;
const CELLS = 20;
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let snake, food, dir, nextDir, score, gameLoop, paused, dead;
let best = +localStorage.getItem('snake-best') || 0;
document.getElementById('best').textContent = best;

const $score = document.getElementById('score');
const $best = document.getElementById('best');
const $message = document.getElementById('message');
const $speed = document.getElementById('speed');

function init() {
  snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  dir = {x: 1, y: 0};
  nextDir = dir;
  score = 0;
  paused = false;
  dead = false;
  $score.textContent = 0;
  $message.textContent = '';
  $message.className = '';
  placeFood();
  if (gameLoop) clearInterval(gameLoop);
  gameLoop = setInterval(tick, +$speed.value);
  draw();
}

function placeFood() {
  while (true) {
    food = { x: Math.floor(Math.random() * CELLS), y: Math.floor(Math.random() * CELLS) };
    if (!snake.some(s => s.x === food.x && s.y === food.y)) break;
  }
}

function tick() {
  if (paused || dead) return;
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (head.x < 0 || head.x >= CELLS || head.y < 0 || head.y >= CELLS ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    die();
    return;
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    $score.textContent = score;
    if (score > best) {
      best = score;
      localStorage.setItem('snake-best', best);
      $best.textContent = best;
    }
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.fillStyle = '#283447';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // grid
  ctx.strokeStyle = 'rgba(255,255,255,.03)';
  for (let i = 0; i <= CELLS; i++) {
    ctx.beginPath(); ctx.moveTo(i*SIZE, 0); ctx.lineTo(i*SIZE, canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i*SIZE); ctx.lineTo(canvas.width, i*SIZE); ctx.stroke();
  }
  // food
  ctx.fillStyle = '#e74c3c';
  ctx.beginPath();
  ctx.arc(food.x * SIZE + SIZE/2, food.y * SIZE + SIZE/2, SIZE/2 - 2, 0, Math.PI * 2);
  ctx.fill();
  // snake
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#2ecc71' : '#27ae60';
    ctx.fillRect(s.x * SIZE + 1, s.y * SIZE + 1, SIZE - 2, SIZE - 2);
  });
}

function die() {
  dead = true;
  clearInterval(gameLoop);
  $message.textContent = `💥 게임 오버! 점수: ${score}`;
  $message.className = 'lose';
}

document.addEventListener('keydown', e => {
  const map = {
    'ArrowLeft': {x:-1,y:0}, 'a': {x:-1,y:0}, 'A': {x:-1,y:0},
    'ArrowRight': {x:1,y:0}, 'd': {x:1,y:0}, 'D': {x:1,y:0},
    'ArrowUp': {x:0,y:-1}, 'w': {x:0,y:-1}, 'W': {x:0,y:-1},
    'ArrowDown': {x:0,y:1}, 's': {x:0,y:1}, 'S': {x:0,y:1},
  };
  if (map[e.key]) {
    e.preventDefault();
    const nd = map[e.key];
    if (nd.x !== -dir.x || nd.y !== -dir.y) nextDir = nd;
  }
  if (e.key === ' ') {
    e.preventDefault();
    if (!dead) {
      paused = !paused;
      $message.textContent = paused ? '⏸ 일시정지' : '';
      $message.className = paused ? 'pause' : '';
    }
  }
});

document.querySelectorAll('.controls button[data-dir]').forEach(btn => {
  btn.addEventListener('click', () => {
    const d = btn.dataset.dir;
    const map = { up: {x:0,y:-1}, down: {x:0,y:1}, left: {x:-1,y:0}, right: {x:1,y:0} };
    const nd = map[d];
    if (nd.x !== -dir.x || nd.y !== -dir.y) nextDir = nd;
  });
});

document.getElementById('newGame').addEventListener('click', init);
$speed.addEventListener('change', () => { if (!dead) init(); });

init();
</script>
</body>
</html>
